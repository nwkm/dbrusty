[package]
name = "dbrusty"
version = "0.1.0"
edition = "2021"
description = "A production-quality cross-platform terminal database client"
license = "MIT"
default-run = "dbrusty"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
itertools = "0.14"
ratatui-textarea = { version = "0.8", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
directories = "6"
keyring = "3"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql", "chrono", "rust_decimal", "any", "json"] }
arboard = "3"
mongodb = { version = "3", features = ["bson-3"] }
bson = { version = "3", features = ["serde", "serde_json-1"] }
redis = { version = "0.29", default-features = false, features = ["tokio-comp", "connection-manager"] }
percent-encoding = "2"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rust_decimal = "1"
nucleo-matcher = "0.3"
csv = "1.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "dbrusty"
path = "src/main.rs"

[[bin]]
name = "seed_postgresql"
path = "src/bin/seed_postgresql.rs"

[[bin]]
name = "seed_mysql"
path = "src/bin/seed_mysql.rs"

[[bin]]
name = "seed_mariadb"
path = "src/bin/seed_mariadb.rs"

[[bin]]
name = "seed_mongodb"
path = "src/bin/seed_mongodb.rs"

[[bin]]
name = "seed_redis"
path = "src/bin/seed_redis.rs"

[[bin]]
name = "seed_sqlite"
path = "src/bin/seed_sqlite.rs"

[[bench]]
name = "scrolling"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

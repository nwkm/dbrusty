services:
  postgres:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:6.0.5
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

volumes:
  postgres-data:
    name: postgres-data
  mongo-data:
    name: mongo-data
  mongo-config:
    name: mongo-config

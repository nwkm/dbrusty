[package]
name = "dbrusty"
version = "0.1.0"
edition = "2021"
description = "A production-quality cross-platform terminal database client"
license = "MIT"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
color-eyre = "0.6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
itertools = "0.14"
unicode-width = "0.2"
directories = "6"
keyring = "3"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "chrono"] }
arboard = "3"
mongodb = { version = "3", features = ["bson-3"] }
bson = { version = "3", features = ["serde", "serde_json-1"] }
rand = "0.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "dbrusty"
path = "src/main.rs"

[[bin]]
name = "seed_postgresql"
path = "src/bin/seed_postgresql.rs"

[[bin]]
name = "seed_mysql"
path = "src/bin/seed_mysql.rs"

[[bin]]
name = "seed_mariadb"
path = "src/bin/seed_mariadb.rs"

[[bin]]
name = "seed_mongodb"
path = "src/bin/seed_mongodb.rs"

[[bench]]
name = "scrolling"
harness = false
